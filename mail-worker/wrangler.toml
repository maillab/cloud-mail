name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

# [[d1_databases]]
# binding = "db"			#d1数据库绑定名默认不可修改

# [[kv_namespaces]]
# binding = "kv"			#kv绑定名默认不可修改

# [[r2_buckets]]
# binding = "r2"			#r2对象存储绑定名默认不可修改

# #[[send_email]]
# #name = "email"			#CF发件, 配置后优先使用

# [[send_email]]
# name = "forward"		#站内转发到已验证的其他邮箱，不限制单个地址

[[send_email]]
name = "forward"		#站内转发到已验证的其他邮箱，不限制单个地址

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]	#每小时执行；resetDaySendCount 仅在 UTC 0 点生效


[vars]
# ai_model = "@cf/meta/llama-3.1-8b-instruct-fast"			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct-fast
# analysis_cache = false			#是否开启分析数据缓存
# orm_log = false			#是否sql日志


# 保留控制台已有的资源绑定和运行时配置；Git 集成只更新代码。
# 此处覆盖 Wrangler 的 keep_bindings，因此也包含变量及密钥类型。
[unsafe.metadata]
keep_bindings = ["plain_text", "json", "secret_text", "secret_key", "kv_namespace", "d1", "r2_bucket", "send_email", "ai"]

[build]
command = "pnpm run build"
