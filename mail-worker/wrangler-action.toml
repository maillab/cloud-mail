name = "${NAME}"
main = "src/index.js"
compatibility_date = "2025-06-04"

[observability]
enabled = true

[[routes]]
pattern = "${CUSTOM_DOMAIN}"
custom_domain = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail"
database_id = "${D1_DATABASE_ID}"

[[kv_namespaces]]
binding = "kv"
id = "${KV_NAMESPACE_ID}"

[[r2_buckets]]
binding = "r2"
bucket_name = "${R2_BUCKET_NAME}"

[[send_email]]
name = "forward"		# Forward in-app mail to other verified addresses; not limited to one address

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
# Only these paths invoke the Worker; /assets/ and other frontend files are served directly
run_worker_first = [ "/api/*", "/oss/*", "/static/*", "/attachments/*", "/proxy", "/realtime" ]

[triggers]
crons = ["0 * * * *"]	# Hourly cron; resetDaySendCount only runs at UTC 0

[[durable_objects.bindings]]
name = "ws"
class_name = "MailHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MailHub"]


[vars]
ai_model = "${AI_MODEL}"
analysis_cache = "${ANALYSIS_CACHE}"
#orm_log = false
domain = "${DOMAIN}"
admin = "${ADMIN}"
password = "${PASSWORD}"
jwt_secret = "${JWT_SECRET}"
project_link = "${PROJECT_LINK}"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
