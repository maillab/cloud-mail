name = "cloud-mail-dev"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[dev]
ip = "0.0.0.0"

[[d1_databases]]
binding = "db"
database_name = "email"
database_id = "a4c1a63a-6ef5-4e6d-8e8c-b6d9e8feb810"

[[kv_namespaces]]
binding = "kv"
id = "2io01d4b299e481b9de060ece9e7785c"

#[[r2_buckets]]
#binding = "r2"
#bucket_name = "email"

#[ai]
#binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

#[[send_email]]
#name = "email"

[[send_email]]
name = "forward"

[vars]
ai_model = ""
analysis_cache = false
orm_log = true
domain = ["example.com", "example2.com", "example3.com", "example4.com"]
admin = "admin@example.com"
#jwt_secret 不要写在这里: 本地开发写入 mail-worker/.dev.vars (已在 .gitignore 中), 例如 jwt_secret="<随机字符串>"
#Do not put jwt_secret here: for local dev put it in mail-worker/.dev.vars (gitignored)
