name: ♻️ Initialize cloud-mail after Cloudflare deployment

# Cloudflare dashboard build-setting changes apply to the next build.
# This workflow initializes only after the matching production commit succeeds.
on:
  push:
    paths:
      - "mail-worker/**"
      - "mail-vue/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: initialize-cloud-mail-${{ github.ref }}
  cancel-in-progress: true

jobs:
  initialize:
    if: github.ref_name == (vars.PRODUCTION_BRANCH || 'send')
    name: Wait for Cloudflare and initialize application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NAME: ${{ secrets.NAME || vars.NAME || 'cloud-mail' }}
      DOMAIN: ${{ secrets.DOMAIN || vars.DOMAIN }}
      APP_URL: ${{ secrets.APP_URL || vars.APP_URL || secrets.CUSTOM_DOMAIN || vars.CUSTOM_DOMAIN }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || vars.JWT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Wait for this commit's successful Cloudflare deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node mail-worker/scripts/wait-for-cloudflare.mjs

      - name: Initialize database and refresh settings
        run: node mail-worker/scripts/initialize-app.mjs

      - name: Report successful initialization
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { applicationUrl } from './mail-worker/scripts/initialize-app.mjs';

          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            'Cloudflare deployment and application initialization succeeded.',
            '',
            `- Application: ${applicationUrl(process.env)}`,
            `- Branch: ${process.env.GITHUB_REF_NAME}`,
            `- Commit: ${process.env.GITHUB_SHA}`,
            ''
          ].join('\n'));
          NODE
